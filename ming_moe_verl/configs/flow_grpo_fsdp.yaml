# Flow-GRPO configuration for Ming-omni-tts BailingMoe model
# Uses verl's FSDP backend with vLLM rollout
#
# Usage:
#   python -m verl.trainer.main_ppo \
#       --config-path=/path/to/ming_moe_verl/configs \
#       --config-name=flow_grpo_fsdp \
#       actor_rollout_ref.model.path=/path/to/bailing-moe-model \
#       data.train_files=/path/to/train.parquet \
#       data.val_files=/path/to/test.parquet

defaults:
  - /verl/trainer/config/ppo_trainer

algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: True
  use_kl_in_reward: False
  gamma: 1.0
  lam: 1.0
  kl_penalty: kl
  kl_ctrl:
    type: fixed
    kl_coef: 0.001

data:
  train_batch_size: 128
  max_prompt_length: 512
  max_response_length: 1024
  filter_overlong_prompts: True
  truncation: error
  shuffle: True

actor_rollout_ref:
  hybrid_engine: true

  model:
    use_remove_padding: True
    enable_gradient_checkpointing: True

  actor:
    strategy: fsdp
    use_kl_loss: True
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    entropy_coeff: 0
    ppo_mini_batch_size: 32
    ppo_micro_batch_size_per_gpu: 4
    loss_agg_mode: token-mean
    optim:
      lr: 1e-6
      weight_decay: 0.01
      lr_warmup_steps: 10
      lr_decay_style: cosine
    fsdp_config:
      param_offload: False
      optimizer_offload: False

  rollout:
    name: vllm
    n: 4
    tensor_model_parallel_size: 2
    gpu_memory_utilization: 0.6
    temperature: 0.7
    top_p: 0.95
    top_k: -1
    log_prob_micro_batch_size_per_gpu: 4

  ref:
    log_prob_micro_batch_size_per_gpu: 4
    fsdp_config:
      param_offload: True

trainer:
  total_epochs: 10
  project_name: ming_moe_flow_grpo
  experiment_name: bailing_moe_grpo_fsdp
  logger:
    - console
    - wandb
  n_gpus_per_node: 8
  nnodes: 1
  save_freq: 20
  test_freq: 5
  val_before_train: False
  balance_batch: True
  device: cuda
